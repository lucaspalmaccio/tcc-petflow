<div class="login-container">
    <h1>Login</h1>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" appFocusInvalid>
        <!-- E-mail -->
        <div class="form-group">
            <label for="email">E-mail <span class="required-hint">(obrigatório)</span></label>
            <input
                    id="email"
                    type="email"
                    formControlName="email"
                    placeholder="nome@exemplo.com"
                    aria-required="true"
                    [attr.aria-invalid]="hasError('email') ? 'true' : null"
                    [attr.aria-describedby]="hasError('email') ? 'email-erro' : null"
                    [class.error]="hasError('email')"
            >
            <div
                    *ngIf="hasError('email')"
                    id="email-erro"
                    class="error-message field-error"
            >
                E-mail inválido.
            </div>
        </div>

        <!-- Senha -->
        <div class="form-group">
            <label for="senha">Senha <span class="required-hint">(obrigatório)</span></label>
            <div class="password-wrapper">
                <input
                        id="senha"
                        [type]="showPassword ? 'text' : 'password'"
                        formControlName="senha"
                        autocomplete="current-password"
                        aria-required="true"
                        [attr.aria-invalid]="hasError('senha') ? 'true' : null"
                        [attr.aria-describedby]="hasError('senha') ? 'senha-erro' : null"
                        [class.error]="hasError('senha')"
                >
                <button type="button" class="toggle-password" aria-controls="senha"
                        (click)="togglePassword()">
                    {{ showPassword ? 'Ocultar senha' : 'Mostrar senha' }}
                </button>
            </div>
            <div
                    *ngIf="hasError('senha')"
                    id="senha-erro"
                    class="error-message field-error"
            >
                Senha é obrigatória.
            </div>
        </div>

        <!-- Mensagem de erro geral -->
        <div *ngIf="errorMessage" role="alert" class="error-message field-error alert alert-error">
            {{ errorMessage }}
        </div>

        <!-- Botão Submit -->
        <button
                type="submit"
                [disabled]="isLoading"
                class="btn-primary"
        >
            <span *ngIf="!isLoading">Entrar</span>
            <span *ngIf="isLoading">Carregando...</span>
        </button>

        <!-- Link cadastro -->
        <button
                type="button"
                class="btn-secondary"
                (click)="cadastrarCliente()"
                [disabled]="isLoading"
        >
            Cadastrar como Cliente
        </button>
    </form>
</div>
