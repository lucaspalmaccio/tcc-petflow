<div class="admin-layout">

    <a class="skip-link" href="#conteudo-principal" appSkipLink="conteudo-principal">Pular para o conteúdo principal</a>

    <aside class="sidebar" aria-label="Navegação lateral">
        <div class="sidebar-header">
            <!-- Logo adicionada aqui -->
            <div class="logo-container">
                <img src="assets/images/logo.png" alt="PetFlow Logo" class="sidebar-logo">
            </div>
            <span class="sidebar-subtitle">Admin</span>
        </div>

        <nav class="sidebar-nav" id="menu-principal" aria-label="Menu principal">
            <a routerLink="/admin/clientes" routerLinkActive="active" ariaCurrentWhenActive="page">
                <i class="icon" aria-hidden="true"></i> Clientes e Pets
            </a>

            <a routerLink="/admin/servicos" routerLinkActive="active" ariaCurrentWhenActive="page">
                <i class="icon" aria-hidden="true"></i>
                Serviços
            </a>
            <a routerLink="/admin/produtos" routerLinkActive="active" ariaCurrentWhenActive="page">
                <i class="icon" aria-hidden="true"></i>
                Produtos
            </a>

            <a routerLink="/admin/agenda" routerLinkActive="active" ariaCurrentWhenActive="page">
                <i class="icon" aria-hidden="true"></i>
                Agenda
            </a>

            <a routerLink="/admin/dashboard" routerLinkActive="active" ariaCurrentWhenActive="page">
                <i class="icon" aria-hidden="true"></i>
                Dashboard
            </a>
        </nav>
    </aside>

    <main class="main-content" id="conteudo-principal" tabindex="-1">

        <header class="main-header" role="banner">
            <div class="header-welcome">
                Olá, <strong>{{ userName || 'Administrador' }}</strong>
            </div>
            <button (click)="logout()" class="btn-logout">
                Sair
            </button>
        </header>

        <div class="page-content">
            <router-outlet></router-outlet>
        </div>

    </main>
</div>
