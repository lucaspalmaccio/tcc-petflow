<div class="cadastrar-admin-container">
    <h1>Cadastrar Administrador</h1>

    <form [formGroup]="form" (ngSubmit)="cadastrar()" appFormA11y>
        <div class="form-group">
            <label for="admin-nome">Nome</label>
            <input id="admin-nome" type="text" autocomplete="name" formControlName="nome" placeholder="Nome completo" />
            <small *ngIf="form.get('nome')?.invalid && form.get('nome')?.touched">Nome é obrigatório.</small>
        </div>

        <div class="form-group">
            <label for="admin-email">Email</label>
            <input id="admin-email" type="email" autocomplete="email" formControlName="email" placeholder="exemplo@email.com" />
            <small *ngIf="form.get('email')?.invalid && form.get('email')?.touched">Email inválido.</small>
        </div>

        <div class="form-group">
            <label for="admin-senha">Senha</label>
            <input id="admin-senha" type="password" autocomplete="new-password" formControlName="senha" placeholder="Mínimo 6 caracteres" />
            <small *ngIf="form.get('senha')?.invalid && form.get('senha')?.touched">Senha inválida.</small>
        </div>

        <button type="submit" [disabled]="carregando">
            {{ carregando ? 'Cadastrando...' : 'Cadastrar' }}
        </button>
    </form>

    <p *ngIf="sucesso" role="status" class="sucesso"><span aria-hidden="true">✅</span> Administrador cadastrado.</p>
    <p *ngIf="erro" role="alert" class="erro"><span aria-hidden="true">❌</span> {{ erro }}</p>
</div>
