<div class="form-container card">
    <div class="form-header">
        <h1>{{ isEditMode ? 'Editar Cliente' : 'Cadastrar cliente' }}</h1>
        <button type="button" class="btn-back" (click)="goBack()">Voltar</button>
    </div>

    <form [formGroup]="clienteForm" (ngSubmit)="onSubmit()" class="form-section">
        <div class="form-row">
            <div class="form-group">
                <label for="cliente-nome">Nome</label>
                <input id="cliente-nome" type="text" formControlName="nome" maxlength="100" autocomplete="name">
            </div>

            <div class="form-group">
                <label for="cliente-email">E-mail</label>
                <input id="cliente-email" type="email" formControlName="email" maxlength="100" autocomplete="email">
            </div>
        </div>

        <div class="form-row" *ngIf="!isEditMode">
            <div class="form-group">
                <label for="cliente-senha">Senha</label>
                <input id="cliente-senha" type="password" formControlName="senha" maxlength="20" placeholder="Digite a senha">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="cliente-cpf">CPF</label>
                <input id="cliente-cpf" type="text"
                       formControlName="cpf"
                       maxlength="14"
                       placeholder="000.000.000-00"
                       (input)="formatCPF($event)">
            </div>

            <div class="form-group">
                <label for="cliente-telefone">Telefone</label>
                <input id="cliente-telefone" type="text"
                       formControlName="telefone"
                       maxlength="15"
                       placeholder="(00) 00000-0000"
                       (input)="formatTelefone($event)">
            </div>
        </div>

        <div class="form-group">
            <label for="cliente-endereco">Endereço</label>
            <input id="cliente-endereco" type="text" formControlName="endereco" maxlength="200" autocomplete="street-address">
        </div>

        <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

        <div class="form-actions">
            <button type="submit" [disabled]="isLoading" class="btn-primary">
                {{ isLoading ? 'Salvando...' : 'Salvar Cliente' }}
            </button>
            <button type="button" class="btn-secondary" (click)="goBack()">Voltar</button>
        </div>
    </form>

    <div class="pet-section" *ngIf="cliente">
        <div class="page-header">
            <h2>Pets do cliente</h2>
        </div>
        <ul *ngIf="cliente.pets.length > 0; else noPets" class="pet-list">
            <li *ngFor="let pet of cliente.pets" class="pet-item">
                <span>{{ pet.nome }} - {{ pet.especie }}</span>
                <div class="pet-actions">
                    <button (click)="openPetModal(pet)" class="btn-edit">Editar</button>
                    <button (click)="onDeletePet(pet)" class="btn-delete">Excluir</button>
                </div>
            </li>
        </ul>
        <ng-template #noPets>
            <div class="no-data">Nenhum pet cadastrado.</div>
        </ng-template>

        <button class="btn-add" (click)="openPetModal()">Adicionar Pet</button>
    </div>

    <app-pet-form-modal
            *ngIf="isPetModalOpen"
            [pet]="currentPetToEdit"
            [clienteId]="clienteId"
            (saveSuccess)="handlePetSave()"
            (closeModal)="closePetModal()">
    </app-pet-form-modal>
</div>
