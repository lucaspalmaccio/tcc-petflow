<div class="container my-4" appMainLandmark>
    <!-- Header com botão voltar -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Meu perfil</h1>
        <button class="btn btn-outline-primary" routerLink="/cliente/meus-agendamentos">
            <i class="bi bi-arrow-left" aria-hidden="true"></i> Voltar aos agendamentos
        </button>
    </div>

    <!-- Mensagens -->
    <div *ngIf="mensagem" role="status" class="alert alert-success alert-dismissible fade show">
        {{ mensagem }}
        <button type="button" class="btn-close" aria-label="Fechar mensagem" (click)="mensagem = ''"></button>
    </div>
    <div *ngIf="erro" role="alert" class="alert alert-danger alert-dismissible fade show">
        {{ erro }}
        <button type="button" class="btn-close" aria-label="Fechar mensagem" (click)="erro = ''"></button>
    </div>

    <div class="row">
        <!-- Coluna Esquerda: Dados Pessoais e Senha -->
        <div class="col-lg-6 mb-4">
            <!-- Dados do Perfil -->
            <div class="card shadow-sm mb-3">
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                    <h2 class="mb-0" style="font-size:0.83em">Dados Pessoais</h2>
                    <button *ngIf="!editandoPerfil" class="btn btn-sm btn-light" (click)="editarPerfil()">
                        Editar
                    </button>
                </div>
                <div class="card-body">
                    <form [formGroup]="perfilForm" appFormA11y>
                        <div class="mb-3">
                            <label for="perfil-nome" class="form-label fw-bold">Nome</label>
                            <input id="perfil-nome" type="text" class="form-control" formControlName="nome"
                                   [readonly]="!editandoPerfil">
                        </div>
                        <div class="mb-3">
                            <label for="perfil-cpf" class="form-label fw-bold">CPF</label>
                            <input id="perfil-cpf" type="text" class="form-control" [value]="perfil?.cpf" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="perfil-email" class="form-label fw-bold">Email</label>
                            <input id="perfil-email" type="email" class="form-control" [value]="perfil?.email" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="perfil-telefone" class="form-label fw-bold">Telefone</label>
                            <input id="perfil-telefone" type="text" class="form-control" formControlName="telefone"
                                   [readonly]="!editandoPerfil">
                        </div>
                        <div class="mb-3">
                            <label for="perfil-endereco" class="form-label fw-bold">Endereço</label>
                            <input id="perfil-endereco" type="text" class="form-control" formControlName="endereco"
                                   [readonly]="!editandoPerfil">
                        </div>

                        <div *ngIf="editandoPerfil" class="d-flex gap-2">
                            <button type="button" class="btn btn-success" (click)="salvarPerfil()">
                                Salvar
                            </button>
                            <button type="button" class="btn btn-secondary" (click)="cancelarEdicaoPerfil()">
                                Cancelar
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Alterar Senha -->
            <div class="card shadow-sm">
                <div class="card-header bg-warning">
                    <h2 class="mb-0" style="font-size:0.83em">Segurança</h2>
                </div>
                <div class="card-body">
                    <button *ngIf="!editandoSenha" class="btn btn-warning w-100" (click)="abrirAlterarSenha()">
                        Alterar Senha
                    </button>

                    <!-- Formulário Alterar Senha -->
                    <form *ngIf="editandoSenha" [formGroup]="senhaForm" appFormA11y>
                        <div class="mb-3">
                            <label for="perfil-senha-atual" class="form-label fw-bold">Senha Atual</label>
                            <input id="perfil-senha-atual" type="password" class="form-control" formControlName="senhaAtual">
                        </div>
                        <div class="mb-3">
                            <label for="perfil-nova-senha" class="form-label fw-bold">Nova Senha</label>
                            <input id="perfil-nova-senha" type="password" class="form-control" formControlName="novaSenha">
                            <small class="text-muted">Mínimo 6 caracteres</small>
                        </div>
                        <div class="mb-3">
                            <label for="perfil-confirmar-senha" class="form-label fw-bold">Confirmar Nova Senha</label>
                            <input id="perfil-confirmar-senha" type="password" class="form-control" formControlName="confirmarNovaSenha">
                        </div>

                        <div class="d-flex gap-2">
                            <button type="button" class="btn btn-success" (click)="alterarSenha()">
                                Confirmar
                            </button>
                            <button type="button" class="btn btn-secondary" (click)="cancelarAlterarSenha()">
                                Cancelar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Coluna Direita: Meus Pets -->
        <div class="col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                    <h2 class="mb-0" style="font-size:0.83em">Meus Pets</h2>
                    <button class="btn btn-sm btn-light" (click)="abrirAdicionarPet()">
                        + Adicionar
                    </button>
                </div>
                <div class="card-body">
                    <!-- Lista de Pets -->
                    <div class="row g-3">
                        <div class="col-md-6" *ngFor="let pet of pets">
                            <div class="card h-100 border-success">
                                <div class="card-body">
                                    <h3 class="card-title text-success" style="font-size:0.67em">{{ pet.nome }}</h3>
                                    <p class="card-text mb-1 small"><strong>Espécie:</strong> {{ pet.especie }}</p>
                                    <p class="card-text mb-3 small"><strong>Raça:</strong> {{ pet.raca }}</p>
                                    <div class="d-flex gap-2">
                                        <button class="btn btn-sm btn-outline-primary" (click)="abrirEditarPet(pet)">
                                            Editar
                                        </button>
                                        <button class="btn btn-sm btn-outline-danger" (click)="deletarPet(pet)">
                                            Excluir
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div *ngIf="pets.length === 0" class="col-12 text-center py-4">
                            <p class="text-muted">Você ainda não cadastrou pets.</p>
                        </div>
                    </div>

                    <!-- Formulário Adicionar/Editar Pet -->
                    <div *ngIf="adicionandoPet" class="mt-4 border-top pt-4">
                        <h3 class="mb-3" style="font-size:0.67em">{{ editandoPet ? 'Editar Pet' : 'Novo Pet' }}</h3>
                        <form [formGroup]="petForm">
                            <div class="mb-3">
                                <label for="pet-nome" class="form-label fw-bold">Nome</label>
                                <input id="pet-nome" type="text" class="form-control" formControlName="nome">
                            </div>
                            <div class="mb-3">
                                <label for="pet-especie" class="form-label fw-bold">Espécie</label>
                                <input id="pet-especie" type="text" class="form-control" formControlName="especie"
                                       placeholder="Ex.: Cachorro, Gato">
                            </div>
                            <div class="mb-3">
                                <label for="pet-raca" class="form-label fw-bold">Raça</label>
                                <input id="pet-raca" type="text" class="form-control" formControlName="raca"
                                       placeholder="Ex.: Golden Retriever, Persa">
                            </div>

                            <div class="d-flex gap-2">
                                <button type="button" class="btn btn-success" (click)="salvarPet()"
                                        [disabled]="!petForm.valid">
                                    Salvar
                                </button>
                                <button type="button" class="btn btn-secondary" (click)="cancelarPet()">
                                    Cancelar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
