<app-route-announcer></app-route-announcer>
<app-reading-mask></app-reading-mask>

<router-outlet></router-outlet>

<!-- Hub de acessibilidade: botão flutuante + painel (Alt + Shift + A) -->
<div class="hub">
  <button type="button" #toggle id="hub-toggle" class="hub-toggle"
          aria-controls="hub-painel" aria-keyshortcuts="Alt+Shift+A"
          [attr.aria-expanded]="open" (click)="toggleHub()">
    <span aria-hidden="true">♿</span> Acessibilidade
  </button>

  <section #panel id="hub-painel" class="hub-panel" *ngIf="open"
           role="dialog" aria-modal="false" aria-labelledby="hub-titulo">
    <div class="hub-header">
      <h2 id="hub-titulo">Acessibilidade</h2>
      <button type="button" class="hub-close" aria-label="Fechar painel de acessibilidade" (click)="closeHub()">
        <span aria-hidden="true">×</span>
      </button>
    </div>

    <p class="hub-hint">As escolhas ficam salvas neste navegador. Atalho: Alt + Shift + A.</p>

    <fieldset class="hub-group">
      <legend>Perfis prontos</legend>
      <button type="button" class="hub-preset" *ngFor="let preset of presets" (click)="applyPreset(preset)">
        <strong>{{ preset.label }}</strong>
        <span>{{ preset.description }}</span>
      </button>
    </fieldset>

    <fieldset class="hub-group">
      <legend>Tamanho do texto</legend>
      <label for="reading-size">Tamanho</label>
      <select id="reading-size" #size (change)="setFontSize(size.value)">
        <option *ngFor="let value of fontSizes" [value]="value" [selected]="fontSize === value">
          {{ value }}%
        </option>
      </select>
    </fieldset>

    <fieldset class="hub-group" *ngFor="let group of groups">
      <legend>{{ group.title }}</legend>
      <label class="reading-choice" *ngFor="let key of group.keys">
        <input type="checkbox" #choice [checked]="isOptionEnabled(key)"
               (change)="setOption(key, choice.checked)">
        {{ optionLabel(key) }}
      </label>
      <p class="hub-hint" *ngIf="group.keys.includes('mask')">
        Com a máscara ativa, a faixa acompanha o mouse, o toque e o foco. Alt + ↑ ou ↓ move a faixa.
      </p>
    </fieldset>

    <fieldset class="hub-group">
      <legend>Atalhos da página</legend>
      <button type="button" *ngIf="hasTarget('conteudo-principal')" (click)="goTo('conteudo-principal')">Ir para o conteúdo principal</button>
      <button type="button" *ngIf="hasTarget('menu-principal')" (click)="goTo('menu-principal')">Ir para o menu</button>
      <p class="hub-hint" *ngIf="!hasTarget('conteudo-principal') && !hasTarget('menu-principal')">Nenhum atalho de página nesta tela.</p>
    </fieldset>

    <button type="button" class="hub-reset" (click)="resetPreferences()">Restaurar padrão</button>
  </section>
</div>
