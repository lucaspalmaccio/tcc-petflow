name: Acessibilidade

# Roda a suíte do front-end (inclui as verificações automáticas axe-core de
# WCAG 2.1 A/AA) em todo push e pull request que altere o petflow-web.
on:
  push:
    paths: ['petflow-web/**', '.github/workflows/acessibilidade.yml']
  pull_request:
    paths: ['petflow-web/**', '.github/workflows/acessibilidade.yml']

jobs:
  testes-e-axe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: petflow-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: petflow-web/package-lock.json
      - run: npm ci
      - name: Testes unitários e axe-core
        run: npm run test:ci
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Build de produção
        run: npm run build
